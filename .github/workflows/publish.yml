# Publish a release from GitHub Actions instead of a terminal: npm with provenance (the "verified" badge on
# npmjs.com), then the MCP Registry, both signed in through GitHub, so there is no token to type or renew.
#
# One-time setup on npmjs.com: package settings > Trusted publishing > GitHub Actions, repository
# Fireiscoolsolo/canvas-lms-mcp-server, workflow file publish.yml. Then run this from the Actions tab
# (Run workflow) after the version bump is pushed. Publishing from a terminal still works as before.
name: Publish

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Every version agrees, and the changelog has this one
        run: node scripts/release-check.mjs
      - name: core/ matches the Local Edition, where it is written, on main
        run: |
          git clone --quiet --depth 1 https://github.com/Fireiscoolsolo/canvas-lms-mcp-local.git ../other
          node ../other/scripts/sync-core.mjs --check .
          cmp scripts/release-check.mjs ../other/scripts/release-check.mjs
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - name: Publish to npm with provenance
        run: npm publish --provenance --access public
      - name: Wait until npm lists the new version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 30); do
            npm view "canvas-lms-mcp-remote@$VERSION" version && exit 0
            sleep 20
          done
          echo "npm still doesn't list $VERSION; publish to the MCP Registry by hand later." && exit 1
      - name: Publish to the MCP Registry
        # A fixed release of the publisher, checked against the SHA-256 GitHub lists for it, not whatever is newest.
        env:
          MCP_PUBLISHER_VERSION: v1.8.4
          MCP_PUBLISHER_SHA256: 5dc2fd415369c73551259f31cd33e2aacc9e0d1021e7f08fef1492d93b781628
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION/mcp-publisher_linux_amd64.tar.gz"
          echo "$MCP_PUBLISHER_SHA256  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
