name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test

  core:
    # core/ and tests/core/ are written once in the Local Edition and copied to the Remote Edition. They must match.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: core/ matches the Local Edition, where it is written, on the same branch name, or main
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          if git ls-remote --exit-code --heads https://github.com/Fireiscoolsolo/canvas-lms-mcp-local.git "$BRANCH" > /dev/null; then REF="$BRANCH"; else REF=main; fi
          echo "Comparing with canvas-lms-mcp-local $REF"
          git clone --quiet --depth 1 --branch "$REF" https://github.com/Fireiscoolsolo/canvas-lms-mcp-local.git ../other
          node ../other/scripts/sync-core.mjs --check .
          cmp scripts/release-check.mjs ../other/scripts/release-check.mjs
          cmp scripts/profile-table.mjs ../other/scripts/profile-table.mjs

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No known high-severity problems in what users install
        run: npm audit --omit=dev --audit-level=high
      - name: The Docker image builds and answers its health check
        run: |
          docker build -t canvas-remote-test .
          docker run -d --name canvas-test -e CANVAS_API_TOKEN=x -e CANVAS_BASE_URL=https://canvas.example.edu -e CANVAS_MCP_PUBLIC_URL=https://canvas-test.example.dev -e CANVAS_MCP_PASSWORD=a-password-for-the-health-check -p 3939:3939 canvas-remote-test
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:3939/healthz && exit 0; sleep 2; done
          docker logs canvas-test; exit 1
