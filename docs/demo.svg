<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 520" width="820" height="520" role="img" aria-label="Example chat: asking an AI assistant what score is needed on a final exam and what is due this week, answered using Canvas MCP tools. Sample data.">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
    .s { opacity: 0; animation-duration: 14s; animation-timing-function: ease-out; animation-iteration-count: infinite; }
    #all { animation: fadeall 14s linear infinite; }
    @keyframes fadeall { 0%, 95% { opacity: 1 } 98%, 100% { opacity: 0 } }
    @keyframes a1  { 0%, 2.86%  { opacity: 0; transform: translateY(6px) } 5.36%, 100% { opacity: 1; transform: none } }
    @keyframes a2  { 0%, 10%    { opacity: 0; transform: translateY(6px) } 12.5%, 100% { opacity: 1; transform: none } }
    @keyframes r1  { 0%, 10%    { opacity: 0 } 12.5%, 17.14% { opacity: 1 } 17.86%, 100% { opacity: 0 } }
    @keyframes d1  { 0%, 17.14% { opacity: 0 } 19.64%, 100% { opacity: 1 } }
    @keyframes a3  { 0%, 20.71% { opacity: 0; transform: translateY(6px) } 23.21%, 100% { opacity: 1; transform: none } }
    @keyframes a4  { 0%, 23.57% { opacity: 0; transform: translateY(6px) } 26.07%, 100% { opacity: 1; transform: none } }
    @keyframes a5  { 0%, 40%    { opacity: 0; transform: translateY(6px) } 42.5%, 100% { opacity: 1; transform: none } }
    @keyframes a6  { 0%, 46.43% { opacity: 0; transform: translateY(6px) } 48.93%, 100% { opacity: 1; transform: none } }
    @keyframes r2  { 0%, 46.43% { opacity: 0 } 48.93%, 52.86% { opacity: 1 } 53.57%, 100% { opacity: 0 } }
    @keyframes d2  { 0%, 52.86% { opacity: 0 } 55.36%, 100% { opacity: 1 } }
    @keyframes a7  { 0%, 56.43% { opacity: 0; transform: translateY(6px) } 58.93%, 100% { opacity: 1; transform: none } }
    @keyframes a8  { 0%, 59.29% { opacity: 0; transform: translateY(6px) } 61.79%, 100% { opacity: 1; transform: none } }
    @keyframes a9  { 0%, 62.14% { opacity: 0; transform: translateY(6px) } 64.64%, 100% { opacity: 1; transform: none } }
    @keyframes a10 { 0%, 66.43% { opacity: 0; transform: translateY(6px) } 68.93%, 100% { opacity: 1; transform: none } }
    .k1{animation-name:a1}.k2{animation-name:a2}.kr1{animation-name:r1}.kd1{animation-name:d1}.k3{animation-name:a3}.k4{animation-name:a4}
    .k5{animation-name:a5}.k6{animation-name:a6}.kr2{animation-name:r2}.kd2{animation-name:d2}.k7{animation-name:a7}.k8{animation-name:a8}.k9{animation-name:a9}.k10{animation-name:a10}
    @media (prefers-reduced-motion: reduce) {
      .s, #all { animation: none !important; opacity: 1 !important; transform: none !important; }
      .kr1, .kr2 { opacity: 0 !important; }
    }
  </style>

  <rect x="0.5" y="0.5" width="819" height="519" rx="16" fill="#0f1520" stroke="#263043"/>
  <circle cx="24" cy="22" r="6" fill="#ff5f57"/><circle cx="44" cy="22" r="6" fill="#febc2e"/><circle cx="64" cy="22" r="6" fill="#28c840"/>
  <text x="410" y="27" text-anchor="middle" font-size="13" fill="#9aa6b8">Canvas MCP: example chat</text>
  <line x1="0" y1="44" x2="820" y2="44" stroke="#263043"/>

  <g id="all">
    <g class="s k1">
      <rect x="340" y="64" width="456" height="40" rx="12" fill="#2563eb"/>
      <text x="358" y="89" font-size="15" fill="#ffffff">What do I need on the final to get a B in Calculus I?</text>
    </g>

    <g class="s k2">
      <rect x="24" y="120" width="320" height="32" rx="8" fill="#1b2330" stroke="#263043"/>
      <text x="40" y="141" font-size="13" fill="#9aa6b8" class="mono">canvas › compute_needed_score</text>
    </g>
    <text x="332" y="141" text-anchor="end" font-size="12" fill="#60a5fa" class="s kr1">running…</text>
    <text x="332" y="141" text-anchor="end" font-size="13" font-weight="700" fill="#4ade80" class="s kd1">✓</text>

    <g class="s k3">
      <text x="24" y="186" font-size="15" fill="#e8eef8">You need <tspan font-weight="700" fill="#60a5fa">84%</tspan> on the final exam to finish with a B (80%).</text>
    </g>
    <g class="s k4">
      <text x="24" y="210" font-size="14" fill="#9aa6b8">You have 78.3% so far with 70% of the grade done, and the final is worth 30%.</text>
    </g>

    <g class="s k5">
      <rect x="596" y="240" width="200" height="40" rx="12" fill="#2563eb"/>
      <text x="614" y="265" font-size="15" fill="#ffffff">What's due this week?</text>
    </g>

    <g class="s k6">
      <rect x="24" y="296" width="320" height="32" rx="8" fill="#1b2330" stroke="#263043"/>
      <text x="40" y="317" font-size="13" fill="#9aa6b8" class="mono">canvas › get_week_ahead</text>
    </g>
    <text x="332" y="317" text-anchor="end" font-size="12" fill="#60a5fa" class="s kr2">running…</text>
    <text x="332" y="317" text-anchor="end" font-size="13" font-weight="700" fill="#4ade80" class="s kd2">✓</text>

    <g class="s k7">
      <rect x="24" y="346" width="46" height="22" rx="6" fill="#16233a"/>
      <text x="47" y="361" text-anchor="middle" font-size="12" font-weight="700" fill="#60a5fa">Mon</text>
      <text x="82" y="362" font-size="15" fill="#e8eef8">BIO 101 · Lab 5 report</text>
    </g>
    <g class="s k8">
      <rect x="24" y="378" width="46" height="22" rx="6" fill="#16233a"/>
      <text x="47" y="393" text-anchor="middle" font-size="12" font-weight="700" fill="#60a5fa">Wed</text>
      <text x="82" y="394" font-size="15" fill="#e8eef8">Calculus I · Quiz 4</text>
    </g>
    <g class="s k9">
      <rect x="24" y="410" width="46" height="22" rx="6" fill="#16233a"/>
      <text x="47" y="425" text-anchor="middle" font-size="12" font-weight="700" fill="#60a5fa">Fri</text>
      <text x="82" y="426" font-size="15" fill="#e8eef8">ENG 102 · Essay draft <tspan fill="#fbbf24">· not started</tspan></text>
    </g>
    <g class="s k10">
      <text x="24" y="466" font-size="14" fill="#9aa6b8">The essay draft is worth the most points, so it's a good one to start first.</text>
    </g>
  </g>

  <text x="796" y="506" text-anchor="end" font-size="11" fill="#5e6878">Sample data</text>
</svg>
